[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optimized-truck-routes-backend"
version = "0.1.0"
description = "Prototype API for truck-aware route scoring and comparison"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - educational prototype" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "networkx>=3.3,<4.0",
  "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.6,<1.0",
]
geo = [
  "geopandas>=1.0,<2.0",
  "pyogrio>=0.9,<1.0",
  "shapely>=2.0,<3.0",
  "pyproj>=3.6,<4.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
truck_routes = ["assets/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
